name: Action CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: node --test
      - run: node scripts/check-signature.mjs
      - name: Check composite metadata and the fork exit path on fork PRs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.id != github.event.pull_request.base.repo.id
        uses: ./
        with: { token: '' }
