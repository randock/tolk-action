# .github/workflows/i18n.yml
on:
  pull_request: { types: [opened, synchronize, reopened, edited] }   # edited: the base branch was changed
  push: { branches: [main] }
jobs:
  gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: write, statuses: write }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.pull_request.head.sha }}", fetch-depth: 0 }
      - uses: randock/tolk-action@v1
        with: { token: "${{ secrets.TOLK_TOKEN }}" }
  main:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: { group: i18n-main, cancel-in-progress: false }      # one at a time
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 50 }                                      # the commits before it: G.2, step 1
      - uses: randock/tolk-action@v1
        with: { command: refresh, token: "${{ secrets.TOLK_TOKEN }}" }
